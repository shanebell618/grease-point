name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # prisma generate just needs a syntactically valid value here, not a
  # reachable database — dataAccess/useCases tests run against an in-memory
  # mock (see src/lib/prisma/mockClient.ts), and the e2e step migrates its
  # own dedicated prisma/test.db via the pretest:e2e script.
  DATABASE_URL: "file:./dev.db"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        # The erd generator pulls in Puppeteer, which downloads a full
        # Chromium build on install — CI never renders the ERD diagram
        # (that's a manual `npm run erd` for local docs), so skip it.
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Generate Prisma client
        run: npx prisma generate --generator client --generator dmmf

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit and component tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # Slowest single step — better-sqlite3's native module compiles fresh
      # here too, and Chromium is a large download. Both are expected.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build Storybook
        run: npm run build-storybook

# Splitting this into parallel jobs (e.g. lint+unit, e2e, storybook) is a
# natural later improvement once this single job gets slow.
